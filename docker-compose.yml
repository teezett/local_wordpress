# Immer mit --env-file .db.env starten (macht das Makefile: `make up`).
services:

  wordpress:
    image: wordpress:${WP_VERSION:-6.8.1}-php${PHP_VERSION:-8.1}-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${DB_USER:?DB_USER fehlt in .db.env}
      WORDPRESS_DB_PASSWORD: ${DB_PASS:?DB_PASS fehlt in .db.env}
      WORDPRESS_DB_NAME: ${DB_NAME:?DB_NAME fehlt in .db.env}
      WORDPRESS_TABLE_PREFIX: ${DB_PREFIX:-wp_}
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://localhost:${WP_PORT:-8080}');
        define('WP_SITEURL', 'http://localhost:${WP_PORT:-8080}');
        define('WP_ENVIRONMENT_TYPE', 'staging');
        define('DISABLE_WP_CRON', true);
        define('WP_DEBUG_DISPLAY', false);
        define('WP_DEBUG_LOG', true);
    volumes:
      - wordpress:/var/www/html
      - ./${WP_CONTENT_DIR:-wp-content}/languages:/var/www/html/wp-content/languages
      - ./${WP_CONTENT_DIR:-wp-content}/plugins:/var/www/html/wp-content/plugins
      - ./${WP_CONTENT_DIR:-wp-content}/themes:/var/www/html/wp-content/themes
      - ./${WP_CONTENT_DIR:-wp-content}/uploads:/var/www/html/wp-content/uploads
      - ./staging/mu-plugins:/var/www/html/wp-content/mu-plugins:ro

  db:
    image: mysql:${MYSQL_VERSION:-8.0.41}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?DB_ROOT_PASS fehlt in .db.env}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Faengt alle ausgehenden Mails ab: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  # WP-CLI, nur bei Bedarf: `make wp ARGS="plugin list"`
  wpcli:
    image: wordpress:cli-php${PHP_VERSION:-8.1}
    profiles: ["tools"]
    user: "33:33"   # www-data des wordpress-Images
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOME: /tmp
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASS}
      WORDPRESS_DB_NAME: ${DB_NAME}
      PROD_URL: ${PROD_URL:-}
      LOCAL_URL: http://localhost:${WP_PORT:-8080}
      DISABLE_PLUGINS: ${DISABLE_PLUGINS:-}
    volumes:
      - wordpress:/var/www/html
      - ./${WP_CONTENT_DIR:-wp-content}/languages:/var/www/html/wp-content/languages
      - ./${WP_CONTENT_DIR:-wp-content}/plugins:/var/www/html/wp-content/plugins
      - ./${WP_CONTENT_DIR:-wp-content}/themes:/var/www/html/wp-content/themes
      - ./${WP_CONTENT_DIR:-wp-content}/uploads:/var/www/html/wp-content/uploads

volumes:
  wordpress:
  db:
